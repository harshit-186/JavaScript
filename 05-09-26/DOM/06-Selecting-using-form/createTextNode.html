<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function addPara() {
        //create a new para and add it in the div
        let p = document.createElement("p");
        let text = document.createTextNode("I am para 3");
        p.appendChild(text);
        let div = document.querySelector("div");
        div.appendChild(p); // appendchild() takes only one parameter at a time which is only elements
      }
    </script>
  </head>
  <body>
    <div>
      <p>I am para 1</p>
      <p>I am para 2</p>
    </div>
    <input type="button" value="Add new para" onclick="addPara()" />
  </body>
</html>
