<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using removeChild()</title>
    <script>
        function addPara(){
            let np = document.createElement("p");
            np.innerText="I am para 3";
            // np.append("WELCOME HEX" );   take as a String 
            let kp = document.createElement("p");
            let text = document.createTextNode("Hey, HI GUYZZ!");
            kp.append(text);
            let div = document.querySelector("#hex");
            // div.append("WELCOME TO JS" , np , kp);
            div.append(np , "WELCOME TO JS" , kp , "JAVASCRIPTS ROCKS!!");
        }
    </script>
</head>
<body>
    <div id="hex">
      <p>I am para 1</p>
      <p>I am para 2</p>
    </div>
    <input type="button" value="Add new para" onclick="addPara()" />
</body>
</html>
