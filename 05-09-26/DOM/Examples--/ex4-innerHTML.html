<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add new course name</title>
    <script>
        function operate(){
            let courseName = prompt("Enter a course name : ");
        //   let x = document.querySelector("ul");
          let x = document.querySelector("li");
          x.innerHTML="<li>"+courseName+"</li>";
        }
    </script>
</head>
<body>
      <h3>Our Courses</h3>
      <ul>
        <li>C</li>
        <li>C++</li>
        <li>Python</li>
        <li>Django</li>
        <li>MERN</li>
        <li>Java</li>
        <li>Oracle</li>
      </ul> 
      <input type="button" value="Click Me" id="" onclick="operate()"/> 
</body>
</html>
