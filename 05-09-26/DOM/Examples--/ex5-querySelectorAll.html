<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function decorate(){
        //write code to add a color border
        //on all elements with class attribute of highlight
        let high = document.querySelectorAll(".highlight");
        high .forEach((x) => {
            x.style.border="2px solid red";
        });
      }
    </script>
  </head>
  <body>
    <h3>Our Courses</h3>
    <ul class="highlight">
      <li>C</li>
      <li>C++</li>
      <li>Python</li>
      <li>Django</li>
      <li>MERN</li>
      <li>Java</li>
      <li>Oracle</li>
    </ul>

    <h3>Our Trainers</h3>
    <ul id="highlight">
      <li>Mr. Sachin Kapoor</li>
      <li>Mr. Paramjeet Singh</li>
      <li>Mr. Udit Namdev</li>
      <li>Mr. Afroz Alam</li>
    </ul>
    <p class="highlight">
      Our trainers have more than 15 years of experience in IT Industry in
      various domains
    </p>

    <input type="button" value="Click me" onclick="decorate()" />
  </body>
</html>
