<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function operate(){
            let today = new Date();
            let str = today.getDate()+"/"+today.getMonth()+1+"/"+today.getFullYear();
            let p = document.querySelector("p");
            p.innerText=str ;
            p.style.color = "crimson";
            p.style.fontWeight="bold";
            
        }
    </script>
</head>
<body>
     <img src="../media/images/scalogo1.png">
    <h2>Welcome To SCA</h2>
    <h3>Our Mission</h3>
    
    <p>
      The mission of the SHARMA COMPUTER ACADEMY is to provide its students with
      the foundation for lifelong learning
    </p>
    
    <input type="button" value="Click me" onclick="operate()">
</body>
</html>
