<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function operate() {          
               // change h3 heading to our vision 

              let h3 = document.querySelector("h3");
                  h3.innerText="Our Vision";
        }
    </script>
</head>

    <h3>Our Mission </h3>
    <input type="button" value="Click Me" onclick="operate()"/>
    
    
</body>
</html>
