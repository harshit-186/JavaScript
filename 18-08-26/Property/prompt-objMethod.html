<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object EXample</title>
    <script>
         let start = "ShuruHoJao";
        let stop = "RUKjao";
        let myCar = new Object();
        myCar.name = "BMW";
        myCar.color = "Blue";
        myCar.year = 2020;

        let x = prompt("Enter property name : ");
        
        document.write(`${x} : ${myCar[x]}<br>`);// gives name of property and values 
        document.write(`${myCar[x]}`);//undefined and prints only value

        
    </script>
</head>

</body>
