<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This example</title>
    <script>
        var a = 10 ;
        function show (){
            var a = 20 ;
            document.write(`a is ${a}`);//local var a = 20 
             document.write(`<br>global a is ${window.a}`);// a = 10
              document.write(`<br>global a is ${this.a}`);// a = 10 // it also refer to global variable
        }
        show();

    </script>
</head>
<body>
    
</body>
</html>
