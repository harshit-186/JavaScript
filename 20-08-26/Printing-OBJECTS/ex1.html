<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let  num = [10,20,30,40];
        document.write(`<br>${num}<br>`);

        let today = new Date();
        document.write(`<br>${today}<br><br>`);

        let myCar = {
            name : "BMW",
            color : "RED" ,
            toString : function () {//override toString
                return `${myCar.color}, ${myCar.name}` ;
            }
        }
        document.write(myCar);
    </script>
</head>

</body>
</html>
