<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account EXAMPLE</title>
    <script>
        let account = {
            accId :  null , 
            name : null ,
            balance :  null ,

            setacc : function (id ,name,balance) {
                account.accId=id ;
                account.name=name;
                account.balance=balance;
            },

            deposit :function(amount){
                if(amount<=0){
                    document.write("INVALID AMOUNT");
                    return;
                }
                account.balance+=amount;
                document.write(`<br> Rs . ${amount} Amount deposited! <br>`);

            },

            withDraw : function(amount){
                if(account.balance<amount){
                    document.write("FUNDS TOO LOW!!");
                    return;
                }

                account.balance-=amount;
                document.write(`<br> Rs . ${amount} Amount Withdrawn!<br>`);
                document.write(`Now balance is ${account.balance}<br>`);

            },

            toString : function(){
                return `AccountID : ${account.accId} , 
                Name : ${account.name} , 
                Balance : ${account.balance}`;

            }

        };

        account.setacc(101 , "RAHUL" , 780000);
        document.write("Account Details : <br>");
        document.write(account);

        account.withDraw(85000);
        account.deposit(600000);

         document.write("Account Details : <br>");
        document.write(account);

    </script>
</head>
<body>
    
</body>
</html>
