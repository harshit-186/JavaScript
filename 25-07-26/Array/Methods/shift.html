<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let fruits = ["apple" , "guava" , "banana"];
        document.write(`Size: ${fruits.length}<br>`);//3
        document.write(`Values : ${fruits}<br>`);//

        let del = fruits.shift();//gives the first elements after deleting the elements from first
         document.write(`Size : ${del}<br>`);//
          document.write(`Values : ${fruits}<br>`);//

          let rem = fruits.shift();
           document.write(`size : ${fruits.length}<br>`);//
           document.write(`Deleted : ${rem}<br>`);//gives the  value
           document.write(`Values : ${fruits}<br>`);//

    </script>
</head>

</body>
</html>
