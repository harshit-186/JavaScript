<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let fruits = [];
        do{
            let str = prompt("Enter fruit names : ");
            if(str == "exit"){
                break;
            }
            fruits.push(str);
        }while(true);
        fruits.sort();
        document.write(`${fruits}`);
    </script>
</head>

</body>
</html>
