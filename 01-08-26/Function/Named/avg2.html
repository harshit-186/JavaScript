<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function avg(){
            let sum = 0;
            for ( let x of arguments){
                document.write(`${x},`);
                sum = sum+x;  
            }
             document.write(`<br> Avg is ${sum/arguments.length}<br>`);
        }
        avg(10,20,30);
        avg(50,30,10,60,80);
    </script>
</head>
