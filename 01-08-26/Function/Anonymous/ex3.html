    <title>Anonymous</title>
    <script>
        //in JS Functions are as First-Class Citizens bcoz it behaves like a variables
        let x = function (name) {
            // document.write("Good Morning Hex <br>");
            let str = "Good Morning "+name;
            return str;
        };
        // let resukt= x("HEX");
        document.write(x("HEX"));
        document.write("<br> <br><br>");

        document.write(x);//gives the entire code of function
    </script>
