<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function setTimer(){
           setInterval  ( () => {
                let now = new Date();
                console.log(`${now}`);
            }, 1000);
        }
    </script>
</head>
<body>
    <input type="button" value="Show time" onclick="setTimer()"/>
</body>
</html>
