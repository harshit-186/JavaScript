<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function compare(a,b){
            if(a>b){
                return 1 ; 
            }
            else if(a<b){
                return -1 ;
            }
            else {
                return 0;
            }
        }
        let arr = [7,2,9,1,5,25];
        arr.sort(compare);
        document.write(`${arr}`);
    </script>
</head>
