<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function multiply(a,b,p){
            let res = a*b ;
            p(res);//p = evenodd , res = num
        }
        function display (num){
            document.write(`Result of product is ${num}<br>`);
        }
        function evenodd(num){
            if(num%2===0){
                document.write(`${num} is even`);
            }
            else{
                document.write(`${num} is odd`);
            }
        }
        function printtable(num){
            document.write(`Table of ${num} is <br>`);
            document.write("<table>");
                for(let i = 1 ; i <= 10; i++){
                    document.write(`<tr><td>${num}*${i} = ${num*i}</td></tr>`);
                }
                document.write("</table>");
        }
        multiply(3,4,printtable);
        multiply(23,78,display);
        multiply(2,9,evenodd);

    </script>
</head>

</html>
