    // parent p lga hua event child p v apply hota h AKA Event Delegation (agr child p event nhi lga hua h to)
      let btn = document.querySelector("#btn");
      let ul = document.querySelector("ul");
         ul.addEventListener("click" , (hex)=>{

        ul.innerHTML = "<li>" + task + "</li>";
