    <style>

}

.modify {
    position: relative;
    left: 120px;
}

caption {
    margin-bottom: 10px;
}
    </style>
</head>
<body>
    
  <form name="myfrm">

        Number Addition Program
      </caption>
      <tbody>
        <tr>

        </tr>
        <tr>

          <td><input type="text" name="txtsno" /></td>

          <td>

    </form>
    <script src="formADD.js"></script>
