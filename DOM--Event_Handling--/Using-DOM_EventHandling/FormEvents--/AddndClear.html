<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      th {
        text-align: right;
      }

      .modify {
        position: relative;
        left: 120px;
      }

      caption {
        margin-bottom: 10px;
      }

      .error {
        outline: none;
        border: solid 2px crimson;
      }

      .success {
        outline: none;
        border: solid 2px limegreen;
      }
    </style>
  </head>
  <body>
    <form name="myfrm">
      <table>
        <caption>
          Number Addition Program
        </caption>
        <tbody>
          <tr>
            <th>First Number:</th>
            <td><input type="text" name="txtfno" /></td>
            <td><span id="fnoerror"></span></td>
          </tr>

          <tr>
            <th>Second Number:</th>
            <td><input type="text" name="txtsno" /></td>
            <td><span id="snoerror"></span></td>
          </tr>

          <tr>
            <th>Sum is:</th>
            <td><input type="text" name="txtresult" /></td>
          </tr>
          <tr>
            <td>
              <input type="button" class="modify" name="btnadd" value="Add" />
            </td>
            <td>
              <input
                type="button"
                class="modify"
                name="btnclear"
                value="Clear"
              />
            </td>
          </tr>
        </tbody>
      </table>
    </form>
    <script src="AddndClear.js"></script>
  </body>
</html>
