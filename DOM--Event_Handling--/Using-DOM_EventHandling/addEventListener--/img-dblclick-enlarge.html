<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        img{
            height: 100px;
            width: 100px;
        }
    </style>
  </head>
  <body>
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLwNHNKEzPQk8XimAFfEeuLdl1cEiwfXQw1hMKB6um7w&s=10"
      alt=""
    />
    <script>
        let img = document.querySelector("img");
        img.addEventListener("dblclick" , ()=>{
            img.style.height = "35%";
            img.style.width = "40%";
        });
    </script>
  </body>
</html>
