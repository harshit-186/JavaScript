<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Returns Promise</title>
</head>
<body>
     <div id="container">
      <h2>Click the button to receive the result of Promise</h2>
      <input type="button" value="Show Result" onclick="doTask()"/><br />
      <br /><br />
      <!-- <span id="result"></span> -->
      <span id="icn"></span>
      <!-- <span id="hex"></span> -->
    </div>
    <script>
        let spn = document.querySelector("#icn");
        async function getEmoji(){
            return 10; // returns Promise until we consume it 
        }
        function doTask(){
            let res = getEmoji();
            spn.innerText = res ;
            console.log("Done!");
        }
    </script>
</body>
</html>
