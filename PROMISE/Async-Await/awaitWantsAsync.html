<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Returns Promise</title>
</head>
<body>
     <div id="container">
      <h2>Click the button to receive the result of Promise</h2>
      <input type="button" value="Show Result" onclick="doTask()"/><br />
      <br /><br />
      <!-- <span id="result"></span> -->
      <span id="icn"></span>
      <!-- <span id="hex"></span> -->
    </div>
    <script>
        let spn = document.querySelector("#icn");
        async function getEmoji(){ // jo promise ka code hota h uske liye async lgate h 
            return 10; // returns Promise until we consume it 
        }
         async function doTask(){
            // await gives the resolve output but await wants its function async also
            let res = await getEmoji();// only Promise resolve consume (if reject then await gives Exception)
            spn.innerText = res ; // 10
            console.log("Done!"); // ye asynchronous code to synchronous bna deta h (done! await k chlne k baad chlega)
        }
    </script>
</body>
</html>
