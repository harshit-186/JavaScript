<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <script>
        let a = 10 ; //modern keyword come in 2015(rebirth of JS) by ES6 both (let and const)
        const b = 50;//value once given is fixed by JS no change in it later
        document.write(`Value of a is ${a} and fixed value is ${b}`);
        document.write(`<br><span style="color: red">Sum of these are ${a+b}</span>`)
    </script>
</head>
<body>
    <h3>Default value of Variables in JS is "Undefined" </h3>
</body>
</html>
