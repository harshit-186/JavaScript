<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let a = parseInt(prompt('Enter first no. : '));
        let b = parseInt(prompt("Enter Second no. : "));
        document.write(`No. are ${a} and ${b}<br>`);
        document.write(`<br>Sum is ${a+b}<br>`);
        document.write(`<br>Sub is ${a-b}<br>`);
        document.write(`<br>div is ${a/b}<br>`);
        document.write(`<br>mod  is ${a%b}<br>`);
    </script>
</head>

</html>
