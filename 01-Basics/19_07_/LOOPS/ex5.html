<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let n,soe=0,sod=0;
        n = Number(prompt("Enter a number : "));
        for(; n >=1 ; n--){
            (n%2===0)?(soe+=n):(sod+=n);
        }
        document.write(`Sum of even no. is ${soe}<br>`);
        document.write(`Sum of odd no. is ${sod}`);
    </script>
</head>
<body>
    
</body>
</html>
