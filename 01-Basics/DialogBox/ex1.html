    <script>
        let age = prompt("what is your age ?");
        document.write(`before pasreInt age is ${typeof age}<br>`);

       document.write(`<br>After pasreInt age is ${typeof age}`);

       document.write(`<br>After 5 years age is ${age+5}`);
    </script>
