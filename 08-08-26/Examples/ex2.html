<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let sum = 0 ; 
        do{
            var a = Number(prompt("Enter a number : "));
            sum = sum + a ;
        }while(a!=0)

        document.write(`Sum is ${sum}`);
    </script>
