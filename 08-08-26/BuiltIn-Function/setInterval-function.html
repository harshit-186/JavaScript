<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
    <script>
        function showDateTime(){
            let now = new Date();
            console.log(`${now}`);
           // setInterval(showDateTime,1000);executes multiple times in a second 

        }
        function setTimer(){
            setInterval(showDateTime,1000);//returns a number (ID) which is use in clearInterval to stop it
        }
    </script>
</head>
<body>
    <input type="button" value="Show time" onclick="setTimer()"/>
</body>
</html>
