<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Reset and base styles */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #333;
      }

      .div1 {
        background: white;
        max-width: 400px;
        width: 100%;
        padding: 30px 25px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      h2 {
        font-size: 2.5rem;
        margin-bottom: 25px;
        color: #ff6f61;
        text-shadow: 1px 1px 5px rgba(255, 111, 97, 0.5);
      }

      #div2 {
        min-height: 120px;
        margin-bottom: 30px;
        padding: 20px;
        background: #f0f4ff;
        border-radius: 12px;
        box-shadow: inset 0 0 10px #d1d9ff;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      #p1 {
        font-weight: 700;
        font-size: 1.2rem;
        margin-bottom: 15px;
        color: #2a2a72;
      }

      #p2 {
        font-style: italic;
        font-size: 1.1rem;
        color: #555;
        opacity: 0.85;
      }

      button#btn {
        background: #ff6f61;
        color: white;
        border: none;
        padding: 15px 35px;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 6px 12px rgba(255, 111, 97, 0.4);
        transition:
          background-color 0.3s ease,
          box-shadow 0.3s ease;
      }

      button#btn:hover {
        background: #ff513d;
        box-shadow: 0 8px 15px rgba(255, 81, 61, 0.6);
      }

      button:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(255, 111, 97, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="div1">
      <h2>😎 Geek Joke Generator</h2>
      <div id="div2">
        <p id="p1">Click the button to get a geek Joke!</p>
        <p id="p2"></p>
      </div>
      <button id="btn">Get New Joke</button>
      <script>
        let xhr = new XMLHttpRequest();
        let btn = document.querySelector("#btn");
        let p1 = document.querySelector("#p1");
        let p2 = document.querySelector("#p2");
        btn.addEventListener("click", () => {
            xhr.readystatechange = prcRespns;
            xhr.open("GET" , "https://official-joke-api.appspot.com/jokes/programming/random" , true);
            xhr.send(null);
        });
        let prcRespns = () => {
          if (xhr.readyState === 4 && xhr.status === 200) {
            let jokeArr = JSON.parse(xhr.responseText);
            let jokeObj = jokeArr[0];
            p1.innerText = jokeObj.setup;
            p2.innerText = jokeObj.punchline;
          } else if (xhr.readyState === 4 && xhr.status !== 200) {
            alert("Error! in API call : " , xhr.status);
          }
        };
      </script>
    </div>
  </body>
</html>
