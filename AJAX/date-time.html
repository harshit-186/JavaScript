<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AJAX Example</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;600&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Josefin Sans", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #a8edea, #fed6e3);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #4a4a4a;
        padding: 20px;
        user-select: none;
      }

      #container {
        background: #fff;
        border-radius: 24px;
        max-width: 460px;
        width: 100%;
        padding: 40px 35px;
        box-shadow:
          0 8px 20px rgba(255, 182, 193, 0.3),
          0 4px 8px rgba(255, 182, 193, 0.15);
        text-align: center;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        cursor: default;
      }

      #container:hover {
        transform: translateY(-8px);
        box-shadow:
          0 16px 40px rgba(255, 182, 193, 0.5),
          0 8px 16px rgba(255, 182, 193, 0.25);
      }

      h1 {
        font-weight: 600;
        font-size: 2.5rem;
        color: #ff6f91;
        margin-bottom: 28px;
        letter-spacing: 1.2px;
        user-select: text;
      }

      p {
        font-weight: 300;
        font-size: 1.1rem;
        margin-bottom: 38px;
        color: #444444;
        line-height: 1.5;
        user-select: text;
        text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
      }

      button {
        background: #ff6f91;
        border: none;
        border-radius: 32px;
        padding: 16px 48px;
        font-size: 1.15rem;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(255, 111, 145, 0.4);
        transition:
          background 0.25s ease,
          transform 0.15s ease,
          box-shadow 0.25s ease;
        user-select: none;
      }

      button:hover {
        background: #ff4c6d;
        box-shadow: 0 12px 28px rgba(255, 76, 109, 0.6);
        transform: scale(1.08);
      }

      button:active {
        transform: scale(0.95);
        box-shadow: 0 6px 12px rgba(255, 76, 109, 0.4);
      }

      .datetime-display {
        margin-top: 32px;
        font-weight: 600;
        font-size: 1.35rem;
        color: #5a5a5a;
        user-select: text;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h2>Get Current Date and Time</h2>
      <p>
        Click the button below and fetch the current date and time from the
        server
      </p>
      <button id="btn">Show Date and Time</button>
      <br><br><br>
      <span id="currentdatetime" class="datetime-display"></span>
      <script>
        let btn = document.querySelector("#btn");
        let span = document.querySelector("#currentdatetime");
        let xhr = new XMLHttpRequest();

        btn.addEventListener("click", () => {
          xhr.onreadystatechange = response; // Handler Setup
          xhr.open(
            "GET",
            "https://timeapi.io/api/Time/current/zone?timeZone=Asia/Kolkata",
            true,
          ); // request generate
          xhr.send(null);
        });

        let response = () => {
          // Handler
          if (xhr.readyState === 4 && xhr.status === 200) {
            let JsonSTR = xhr.responseText;
            let JSobj = JSON.parse(JsonSTR);
            let DateTime = JSobj.dateTime; // in uniquex Style
            let DateTimeObj = new Date(DateTime);
            // let finalTime = DateTimeObj.toLocaleTimeString();
            // let finalDate = DateTimeObj.toDateString();
            // console.log(finalDate);
            // console.log(finalTime);
            let finalDT =
              DateTimeObj.toLocaleTimeString() +
              "<br>" +
              DateTimeObj.toDateString();
            span.innerHTML = finalDT;
          } else if (xhr.readyState === 4 && xhr.status !== 200) {
            alert("Error! in recieving Date and Time");
          }
        };
      </script>
    </div>
  </body>
</html>
