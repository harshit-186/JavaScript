<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let bday = prompt("Enter your Birthdate(yyyy-mm-dd)");
        let bdayDate = new Date(bday);
        let dayNum = bdayDate.getDay();
        let days = [ "Sunday" , "Monday" , "Tuesday" , "Wednesday" , "Thursday" , "Friday" , "Saturday"];
        document.write(`Your Birthday is on : ${bday} and it was : ${days[dayNum]} `);

    </script>
</head>

</body>
</html>
